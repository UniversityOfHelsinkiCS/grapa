# See e2e/manual/README.md. Own project and ports, so it runs beside the dev stack.
name: grapa-manual

services:
  app:
    build:
      context: .
      args:
        - E2E=true
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - REDIS_HOST=redis
      - TZ=Europe/Helsinki
    command: ['npm', 'run', 'start:test']
    ports:
      - 127.0.0.1:${MANUAL_APP_PORT:-8010}:8000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15.10
    environment:
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7-alpine

  # The tag versions the narration cache, changing it regenerates every clip
  tts:
    image: registry.version.helsinki.fi/toska/openshift/kontit/guide-video-voice:1.0.0
    profiles: [manual]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - 127.0.0.1:${MANUAL_TTS_PORT:-5005}:5005

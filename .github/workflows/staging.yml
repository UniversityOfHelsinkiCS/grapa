name: Test and deploy to staging

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:front
      - run: npm run test:integration

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # runs-on: runner-scaleset #tämän pitää olla tarkalleen tämä että oikea runner löytyy organisaation alta.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # The newest videos recorded on master, not necessarily of this commit
      - uses: ./.github/actions/manual-videos-pull
        with:
          registry-password: ${{ secrets.VERSION_PULL_SECRET }}

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: grapa
          tags: staging ${{ github.sha }}
          containerfiles: |
            ./Dockerfile
          build-args: |
            BASE_PATH=
            GIT_SHA=${{ github.sha }}
            STAGING=true
            E2E=false
          # ulimit 4096 is required for the buildah to work
          # otherwise throws error "Too many open files"
          extra-args: --ulimit nofile=4096:4096

      - name: Push to registry.version.helsinki.fi
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
